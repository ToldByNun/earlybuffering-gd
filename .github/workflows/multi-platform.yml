name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: iOS
            os: macos-latest
            target: iOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          sdk: given

      - name: Verify iOS dylib signature in package
        if: matrix.config.name == 'iOS'
        shell: bash
        run: |
          set -euo pipefail
          PKG=$(find . -name 'audesign.earlybuffer.geode' -type f | head -n 1)
          if [[ -z "${PKG}" ]]; then
            echo "ERROR: no audesign.earlybuffer.geode after iOS build"
            exit 1
          fi
          echo "Checking ${PKG}"
          python3 tools/geode_package_check.py "${PKG}" --require ios --check-ios-sign

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: earlybuffer-${{ github.sha }}
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
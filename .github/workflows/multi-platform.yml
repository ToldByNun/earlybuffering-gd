name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            slug: win
            os: windows-latest
          - name: macOS
            slug: mac
            os: macos-latest
          - name: iOS
            slug: ios
            os: macos-latest
            target: iOS
          - name: Android32
            slug: android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            slug: android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: modbuild
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: false
          configure-args: -DGEODE_PACKAGE_ZSTD=OFF
          target: ${{ matrix.config.target }}
          sdk: given

      - name: Verify iOS dylib signature in package
        if: matrix.config.name == 'iOS'
        shell: bash
        run: |
          set -euo pipefail
          PKG=$(find "${{ steps.modbuild.outputs.build-output }}" -name 'audesign.earlybuffer.geode' -type f | head -n 1)
          if [[ -z "${PKG}" ]]; then
            PKG=$(find . -name 'audesign.earlybuffer.geode' -type f | head -n 1)
          fi
          if [[ -z "${PKG}" ]]; then
            echo "ERROR: no audesign.earlybuffer.geode after iOS build"
            exit 1
          fi
          echo "Checking ${PKG}"
          python3 tools/geode_package_check.py "${PKG}" --require ios --check-ios-sign --check-install-name

      # Our package job consumes these explicit per-platform artifacts only.
      - name: Stage platform package
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.modbuild.outputs.build-output }}"
          mkdir -p platform-out
          PKG=""
          if [[ -n "${OUT}" ]]; then
            PKG=$(find "${OUT}" -name 'audesign.earlybuffer.geode' -type f | head -n 1 || true)
          fi
          if [[ -z "${PKG}" ]]; then
            PKG=$(find . -name 'audesign.earlybuffer.geode' -type f | head -n 1 || true)
          fi
          if [[ -z "${PKG}" ]]; then
            echo "ERROR: no audesign.earlybuffer.geode to stage"
            exit 1
          fi
          cp "${PKG}" "platform-out/audesign.earlybuffer.geode"
          echo "Staged ${PKG} ($(wc -c < platform-out/audesign.earlybuffer.geode) bytes)"
          ls -la platform-out

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: earlybuffer-${{ matrix.config.slug }}-${{ github.sha }}
          path: platform-out/audesign.earlybuffer.geode
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Download our platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: earlybuffer-*-${{ github.sha }}
          path: platform-input

      - name: Bundle all five platforms
        run: python tools/bundle_geode.py --input-dir platform-input --output bundle-out/audesign.earlybuffer.geode

      - name: Test package validation
        run: |
          python tools/test_geode_package_check.py
          python tools/test_bundle_geode.py

      - name: Gate package (binaries + no zstd + iOS filename)
        shell: bash
        run: |
          set -euo pipefail
          PKG="bundle-out/audesign.earlybuffer.geode"
          if [[ ! -f "${PKG}" ]]; then
            echo "ERROR: no final bundle"
            exit 1
          fi
          echo "Checking ${PKG}"
          python3 tools/geode_package_check.py "${PKG}" \
            --require win --require android64 --require android32 --require mac --require ios \
            --forbid-zstd --check-install-name

      - uses: actions/upload-artifact@v4
        with:
          name: earlybuffer-${{ github.sha }}
          path: |
            bundle-out/audesign.earlybuffer.geode
            bundle-out/audesign.earlybuffer.sha256.txt
          if-no-files-found: error
          retention-days: 30
